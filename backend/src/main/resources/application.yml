spring:
  application:
    name: stockflow-backend
  profiles:
    default: dev
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  task:
    scheduling:
      pool:
        size: 1

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,stockFlowReadiness

stockflow:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    access-token-seconds: ${AUTH_ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${AUTH_REFRESH_TOKEN_SECONDS:2592000}
    initial-passwords:
      rodrigo: ${AUTH_INITIAL_PASSWORD_RODRIGO:}
      cesar: ${AUTH_INITIAL_PASSWORD_CESAR:}
    cookie:
      name: ${AUTH_COOKIE_NAME:stockflow_refresh}
      path: ${AUTH_COOKIE_PATH:/api/v1/auth/web}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    operational:
      password-min-length: ${AUTH_PASSWORD_MIN_LENGTH:12}
      password-max-length: ${AUTH_PASSWORD_MAX_LENGTH:128}
      initial-password-temporary: ${AUTH_INITIAL_PASSWORD_TEMPORARY:true}
      refresh-retention-days: ${AUTH_REFRESH_RETENTION_DAYS:30}
      login-rate-limit:
        attempts: ${AUTH_LOGIN_RATE_LIMIT_ATTEMPTS:5}
        window-seconds: ${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
      refresh-rate-limit:
        attempts: ${AUTH_REFRESH_RATE_LIMIT_ATTEMPTS:30}
        window-seconds: ${AUTH_REFRESH_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allow-credentials: true
  idempotency:
    retention-days: ${IDEMPOTENCY_RETENTION_DAYS:90}
  http:
    max-body-bytes: ${HTTP_MAX_BODY_BYTES:1048576}
