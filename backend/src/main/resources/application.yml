spring:
  application:
    name: stockflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DB_USERNAME:stockflow}
    password: ${DB_PASSWORD:stockflow}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

stockflow:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    access-token-seconds: ${AUTH_ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${AUTH_REFRESH_TOKEN_SECONDS:2592000}
    initial-passwords:
      rodrigo: ${AUTH_INITIAL_PASSWORD_RODRIGO:}
      cesar: ${AUTH_INITIAL_PASSWORD_CESAR:}
