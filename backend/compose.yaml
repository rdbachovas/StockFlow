services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow_local
      POSTGRES_PASSWORD: stockflow_local_password
    volumes:
      - stockflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow_local -d stockflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: stockflow-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/stockflow
      DB_USERNAME: stockflow_local
      DB_PASSWORD: stockflow_local_password
      AUTH_JWT_SECRET: local-only-jwt-secret-with-at-least-32-bytes
      AUTH_INITIAL_PASSWORD_RODRIGO: RodrigoLocal123!
      AUTH_INITIAL_PASSWORD_CESAR: CesarLocal123!
      AUTH_INITIAL_PASSWORD_TEMPORARY: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:19006
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:$${PORT:-8080}/api/v1/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

volumes:
  stockflow_postgres_data:
